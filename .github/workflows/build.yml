name: Daily WNBA stats build

# Runs every morning, rebuilds the static page from fresh box scores, commits
# the result, and deploys directly to Cloudflare via wrangler. This is the
# ONLY deploy path — Cloudflare's Connect-to-Git integration has been
# disconnected (June 2026) to avoid version-promotion conflicts when human
# pushes and bot pushes arrive close together.
#
# ⚠️ YAML gotcha — never put a bare colon-space (": ") inside an UNQUOTED
# scalar value (a `run:` line, `name:`, a commit message, etc.). YAML reads
# the ": " as a key/value separator and silently mis-parses the file — no
# error, the workflow just stops registering. That is exactly what broke
# `workflow_dispatch` on 2026-06-16. If a value must contain a colon-space,
# quote the whole value: "like: this".
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Post the daily leaders to Bluesky"
        type: boolean
        default: true
      allow_partial:
        description: "Publish even if the ESPN fetch came back incomplete"
        type: boolean
        default: false

permissions:
  contents: write          # allow the job to commit the rebuilt HTML

# If a run is still going when the next fires, let the new one wait rather
# than clobber.
concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml

      # One dependency declaration, in core/pyproject.toml (D9). The editable
      # install also puts `sag` on the path, which every site script imports
      # for its league config.
      - name: Install dependencies
        run: pip install -e core/

      # Persist the accumulated box-score / pbp CSVs between runs so
      # fetch_data.py only pulls games it hasn't seen (incremental). The path
      # is the league's data DIRECTORY rather than a list of filenames (D12),
      # so a data file added later is cached without anyone remembering to
      # update this. Bumped to v5 at the Phase 1 restructure: a cache restores
      # files to the paths recorded when it was saved, so moving the CSVs
      # orphans the v4 entries — bumping makes the one full re-fetch
      # intentional and legible instead of a mystery slow build. Without
      # this, every fresh checkout starts empty and re-fetches the whole season
      # (~170 ESPN summary calls). These files are gitignored build artifacts,
      # so the cache — not git — is how they carry over.
      #
      # The unique run_id in the key means the exact key never hits, so a fresh
      # cache is always saved at job end; restore-keys seeds it from the most
      # recent prior cache. Bump the vN token if the CSV schema changes, to
      # force one clean full rebuild instead of concatenating mismatched columns.
      - name: Restore fetched-data cache
        uses: actions/cache@v4
        with:
          path: sites/wnba/data
          key: wnba-data-v5-${{ github.run_id }}
          restore-keys: |
            wnba-data-v5-

      # fetch_data.py exits non-zero when the fetch came back incomplete — an
      # unreadable scoreboard date, a game that wouldn't download, or a missing
      # schedule. That FAILS THE JOB ON PURPOSE, so no stale page is rebuilt or
      # deployed (2026-08-05: ESPN 403'd every call and three builds went green
      # while republishing day-old data). Whatever it did fetch is still written
      # and cached, so the next run resumes from there.
      #
      # Tick "allow_partial" in the Run workflow UI to publish anyway.
      - name: Fetch latest box scores
        run: python sites/wnba/fetch_data.py
        env:
          ALLOW_PARTIAL: ${{ inputs.allow_partial && '1' || '0' }}

      - name: Build static page
        run: |
          python sites/wnba/build_stats_page.py
          cp sites/wnba/wnba-2026-stats-explorer.html sites/wnba/public/index.html

      # Layer-2 external verification (validate_stats.py) — diffs our leader
      # boards against stats.wnba.com's API. Never blocks the site deploy
      # (continue-on-error), but its leaders_ok output gates the Bluesky post
      # below: a wrong page can be silently rebuilt tomorrow, a wrong post
      # can't be unpublished. Writes validation_report.json (read by the
      # cron-worker health check) and player_id_crosswalk.json (persisted
      # ESPN-athlete-id → WNBA-player-id matches), both committed below.
      - name: Validate against stats.wnba.com
        id: validate
        continue-on-error: true
        run: python sites/wnba/validate_stats.py --gate

      # Append yesterday's usage totals to usage_history.jsonl. Workers
      # Analytics Engine only retains 90 days, and collection started
      # 2026-07-12, so July data starts falling off the back around mid-October
      # — during the playoffs, exactly when a season-long comparison gets
      # interesting. This committed rollup is what outlives that window.
      #
      # continue-on-error on purpose. This is a reporting nicety; it must never
      # be able to stop the site from deploying. A missing day is recoverable
      # (python usage_report.py --snapshot --date YYYY-MM-DD), a missed deploy
      # is not. The step is also idempotent — rerunning a day is a no-op.
      - name: Snapshot usage stats
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: python usage_report.py --snapshot

      - name: Commit updated site
        run: |
          git config user.name  "wnba-stats-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/wnba/public/index.html
          git add validation_report.json player_id_crosswalk.json
          git add usage_history.jsonl
          # Only commit if something actually changed (e.g. skip on an off-day).
          if git diff --staged --quiet; then
            echo "No changes to publish today."
          else
            git commit -m "Daily stats update: $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Deploy to Cloudflare
        run: npx wrangler deploy -c sites/wnba/wrangler.toml --message "Daily stats update $(date -u +'%Y-%m-%d')"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Retention loop: post one leader category per day (rotation) + last
      # night's factoid to Bluesky. Runs LAST and never blocks the deploy —
      # continue-on-error keeps a failed post from failing the workflow, but a
      # failure still shows as a red step so it isn't silent. Reads only our own
      # social_payload.json (written by build_stats_page.py), never Bluesky's
      # feed reads. Skips cleanly if the app-password secrets aren't set.
      # `post` defaults to true, so the daily cron dispatch (which sends no
      # inputs) always posts. A manual run can skip it: uncheck the box in the
      # Actions "Run workflow" UI, or hit the cron-worker URL with &post=false.
      # Gated on the Layer-2 leaders check: if validation failed (or the
      # validator crashed — leaders_ok is then unset/false), the post is
      # skipped while the site still deploys. SKIPPED (source lagging) counts
      # as ok — our own data already passed the Layer-1 guards.
      - name: Post daily leaders to Bluesky
        if: ${{ inputs.post && steps.validate.outputs.leaders_ok == 'true' }}
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python sites/wnba/post_to_bluesky.py
