name = "wnba-stats-cron"
main = "worker.js"
compatibility_date = "2025-06-01"

# 11:17 UTC = 7:17am ET (summer/EDT) — dispatches the daily build.
#
# The other three are health-check passes. A fixable problem (failed build,
# stale site, data behind stats.wnba.com) triggers an auto-rebuild and stays
# quiet; the next pass re-checks. The LAST one is final — it stops retrying
# and emails whatever is still broken. Keep this list, and its order, in sync
# with CHECK_CRON / RETRY_CRON / FINAL_CRON in worker.js.
#
#   11:45 UTC — health check, pass 1
#   13:15 UTC — health check, pass 2
#   14:45 UTC — health check, FINAL (emails; also reports on the WWC site)
#
# 22:00 UTC dispatches the WWC BUILD (wwc.yml), added 2026-08-30. The time is
# derived, not guessed: the tournament's latest tip is 19:00 GMT (Sep 4) and a
# game runs ~2h plus OT, so the latest plausible final is ~21:15 GMT. Anything
# earlier rebuilds mid-game. See WWC_DISPATCH_CRON in worker.js.
#
# ⚠️ THIS LIST IS FULL. Cloudflare's Free plan allows **5 Cron Triggers per
# ACCOUNT**, not per Worker (Paid: 250), and this is the only Worker on the
# account with any. A sixth trigger anywhere will fail to deploy. The WWC
# morning catch-up therefore rides on the 11:17 dispatch instead of owning a
# slot — see the routing in worker.js `scheduled()`.
[triggers]
crons = ["17 11 * * *", "45 11 * * *", "15 13 * * *", "45 14 * * *", "0 22 * * *"]

# Failure alerts via Cloudflare Email Routing on statsataglance.com.
# Requires: Email Routing enabled on the zone, and the destination address
# verified there (it gets a one-time confirmation email).
[[send_email]]
name = "ALERT_EMAIL"
destination_address = "horowitz.jason@gmail.com"
