name: Daily WNBA stats build

# Runs every morning, rebuilds the static page from fresh box scores, commits
# the result, and deploys directly to Cloudflare via wrangler. This is the
# ONLY deploy path — Cloudflare's Connect-to-Git integration has been
# disconnected (June 2026) to avoid version-promotion conflicts when human
# pushes and bot pushes arrive close together.
on:
  workflow_dispatch:

permissions:
  contents: write          # allow the job to commit the rebuilt HTML

# If a run is still going when the next fires, let the new one wait rather
# than clobber.
concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest box scores
        run: python fetch_data.py

      - name: Build static page
        run: |
          python build_stats_page.py
          mkdir -p public
          cp WNBA-2026-stats-explorer.html public/index.html

      - name: Commit updated site
        run: |
          git config user.name  "wnba-stats-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          # Only commit if something actually changed (e.g. skip on an off-day).
          if git diff --staged --quiet; then
            echo "No changes to publish today."
          else
            git commit -m "Daily stats update: $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --message "Daily stats update: $(date -u +'%Y-%m-%d')"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
