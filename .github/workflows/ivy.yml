# Ivy League women's basketball — ivy-hoops.statsataglance.com
#
# PRIVATE PREVIEW (2026-11-11): the hostname is behind Cloudflare Access until
# launch; pages carry noindex and robots.txt disallows everything.
#
# One workflow, one site, same shape as wwc.yml — neither site can block the
# other — with two deliberate differences:
#
#   1. The built site is NOT committed. WWC's public/ is a frozen archive;
#      this one is rewritten by every data pull (~170 game pages), so it is
#      built and deployed from the runner and sites/ivy/public/ is gitignored.
#      That also means this job needs no write access to the repo.
#   2. Every run FETCHES. There is no frozen data to rebuild from: the ESPN
#      pull is ~15 s, and finished box scores are cached between runs below.
#
# ⚠️ No `schedule:` here, on purpose. Scheduled builds on this account are
# dispatched by the Cloudflare cron Worker (workers/cron/), because GitHub's
# native schedule proved unreliable. The Free plan allows 5 Cron Triggers per
# ACCOUNT; the WNBA ones were paused 2026-11-10 to free them. Adding a daily
# Ivy dispatch is a separate change to workers/cron (deployed by hand).
#
# Triggers today:
#   - push to main touching sites/ivy/**, core/** or this file (a merged PR)
#   - "Run workflow" (workflow_dispatch) — the data refresh button, usable
#     from the GitHub mobile app.

name: Ivy site build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sites/ivy/**'
      - 'core/**'
      - '.github/workflows/ivy.yml'

permissions:
  contents: read

concurrency:
  group: ivy-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - name: Install dependencies
        run: pip install -e core/

      # Final box scores never change, so they are kept between runs. The key is
      # unique per run (caches are immutable); restore-keys picks up the newest.
      - name: Restore cached box scores
        uses: actions/cache@v6
        with:
          path: sites/ivy/data/raw/summaries
          key: ivy-summaries-${{ github.run_id }}
          restore-keys: ivy-summaries-

      - name: Fetch ESPN data
        run: python sites/ivy/fetch_data.py

      - name: Build pages
        run: python sites/ivy/build_ivy_pages.py

      - name: Deploy to Cloudflare
        run: npx wrangler deploy -c sites/ivy/wrangler.toml --message "Ivy site build $(date -u +'%Y-%m-%d %H:%M')"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
