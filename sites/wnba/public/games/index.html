<style>  :root {
    --bg:#0f0f0f; --surface:#1a1a1a; --border:#2e2e2e;
    --text:#e8e8e8; --muted:#888; --accent:#f5a623;
    --avg:#aaa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);
        font-size:13.5px;padding:14px 10px;max-width:640px;margin:0 auto;
        line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--muted)}
  h1{color:var(--accent);font-size:16px;font-weight:700;letter-spacing:-.2px;
      margin-bottom:2px}
  .rnd{color:var(--muted);font-size:11.5px;margin-bottom:10px}
  .ser{color:var(--accent);font-size:12px;margin-top:2px}
  .data-note{color:var(--muted);font-size:10px;margin-top:14px}
  .backl{display:inline-block;color:var(--accent);font-size:12px;
      padding:6px 0 12px;text-decoration:none}
  .backl:hover{text-decoration:underline}
  /* ── Games tab ── */
  .gm-daybar{color:var(--accent);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    border-bottom:1px solid var(--border);padding:10px 0 5px;margin-top:6px}
  .gm-daybar:first-child{margin-top:0}
  .gm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 2px;border-bottom:1px solid #161618}
  .gm-row .gm-match{font-size:15px}
  .gm-row.gm-sched .gm-match{color:var(--text)}
  .gm-row.gm-sched .gm-when{color:var(--muted);font-size:12px}
  .gm-row.gm-result{cursor:pointer}
  .gm-row.gm-result .gm-s{color:var(--muted)}
  .gm-row.gm-result .gm-s.gm-win{color:var(--text);font-weight:700}
  .gm-row .gm-dash{color:var(--muted)}
  .gm-row .gm-chev{color:var(--muted);font-size:18px}
  .gm-row.gm-result:active{background:var(--surface)}
  .gm-hint{color:var(--muted);font-size:11px;margin-top:14px}
  .gm-empty{color:var(--muted);font-size:12px;padding:14px 2px}
  .gm-back{color:var(--accent);font-size:13px;padding:4px 0 12px;cursor:pointer;display:inline-block}
  .gm-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
  .gm-hd .gm-tm{font-size:15px;font-weight:700}
  .gm-hd .gm-sc{font-size:22px;font-weight:700}
  .gm-hd .gm-rec{color:var(--muted);font-weight:400;font-size:12px}
  .gm-fin{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:11px;text-align:center}
  .gm-win{color:#7ec27e}
  .gm-meta{color:var(--muted);font-size:11px;margin:8px 0 14px}
  .gm-h2{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;
    border-bottom:1px solid var(--border);padding-bottom:5px;margin:18px 0 6px}
  .gm-ls{border-collapse:collapse;width:auto;margin:10px 0 20px;font-size:13px}
  .gm-ls th,.gm-ls td{padding:3px 10px;text-align:right}
  .gm-ls .gm-pl{text-align:left;color:var(--muted)}.gm-ls .gm-t{border-left:1px solid var(--border)}
  .gm-ts{border-collapse:collapse;width:auto;margin:4px 0 8px;font-size:12px}
  .gm-ts th,.gm-ts td{padding:2px 10px;text-align:right;white-space:nowrap}
  .gm-ts .gm-pl{text-align:left}
  .gm-ts .gm-cols th{color:var(--muted);font-weight:400;border-bottom:1px solid var(--border)}
  .gm-ts .gm-v td{padding-top:7px}.gm-ts .gm-v .gm-pl{font-weight:700}
  .gm-ts .gm-p td{color:var(--muted);font-size:10px;padding-top:0;padding-bottom:3px}
  .gm-tcap{font-weight:700;margin:18px 0 3px}.gm-tcap .gm-rec{color:var(--muted);font-weight:400;font-size:12px}
  .gm-tscroll{position:relative;margin-bottom:6px}
  .gm-tscroll::after{content:"";position:absolute;top:0;bottom:0;right:0;width:26px;
    pointer-events:none;opacity:0;transition:opacity .15s ease;z-index:5;
    background:linear-gradient(to right, rgba(15,15,15,0), var(--bg))}
  .gm-tscroll.more-right::after{opacity:1}
  .gm-tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .gm-bx{border-collapse:collapse;min-width:520px;width:100%;font-size:12px}
  .gm-bx th,.gm-bx td{padding:3px 6px;text-align:right;white-space:nowrap}
  .gm-bx .gm-pl{text-align:left;position:sticky;left:0;background:var(--bg);min-width:88px;padding-left:0}
  .gm-bx .gm-cols th{border-bottom:1px solid var(--accent);color:var(--muted);font-weight:400}
  .gm-bx .gm-sec td{color:var(--accent);font-size:10px;letter-spacing:.1em;padding-top:9px;text-transform:uppercase}
  .gm-bx tr:not(.gm-cols):not(.gm-sec) td{border-top:1px solid #18181b}
  .gm-pos{color:var(--muted);font-size:10px;display:inline-block;min-width:18px}
  /* Games-tab quantities that are NOT `tbody td:not(:first-child)` and so are
     missed by the structural rule above: the big final score, the inline
     result-row scores, W-L records, and the line score's period headers
     (1 2 3 4 T). All read as numbers and take the mono face. Team names,
     the day bar and the "Final" label stay in the sans face. */
  .gm-row.gm-result .gm-s,.gm-hd .gm-sc,.gm-hd .gm-rec,
  .gm-tcap .gm-rec,.gm-ls th{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}  .masthead{margin-bottom:14px;font-size:12px;line-height:1.7}
  .masthead .site-name{color:var(--accent);text-decoration:none;font-size:14px}
  .masthead .site-name:hover{text-decoration:underline}
  .masthead .crumb{color:var(--muted);font-size:11px}
  .masthead .crumb a{color:var(--muted)}
  .masthead .crumb a:hover{color:var(--accent)}
  .site-footer{margin-top:34px;padding-top:12px;border-top:1px solid var(--border);
      color:var(--muted);font-size:11px;line-height:1.8}
  .site-footer a{color:var(--muted);text-decoration:underline}
  .site-footer a:hover{color:var(--accent)}
</style>
<style>table.s{border-collapse:collapse;width:100%;font-size:12px}table.s th{color:var(--muted);text-align:left;padding:5px;border-bottom:1px solid var(--border);font-weight:normal;text-transform:uppercase;font-size:10px;letter-spacing:.4px}table.s td{padding:6px 5px;border-bottom:1px solid var(--border)}table.s td a{color:var(--text);text-decoration:underline;text-decoration-color:rgba(136,136,136,.45);text-underline-offset:2px}table.s td a:hover{color:var(--accent)}</style>

<script>/* -- Usage tracking (Workers Analytics Engine via wnba-usage-tracker) --
   Cloudflare Web Analytics only sees the initial page load on this
   single-file site, since tabs and box scores are client-side JS, not
   real navigation. This sends small, cookie-free beacon pings so we can
   see which tabs get used and whether box scores get opened. Fails
   silently if the endpoint is unreachable -- never blocks the page. */
var TRACK_URL = 'https://usage.statsataglance.com/t';
/* Which statsataglance property this page is. Sent on every beacon so one
   dataset can answer cross-site questions (does the Cup site hand users back
   to WNBA?). Added 2026-08-05 before a second site existed — rows without it
   predate the change and are WNBA by definition. */
var SITE_ID = 'wnba';
/* Referring hostname -- the only way to see search/Reddit/etc, since
   utm_source can only see links we tagged ourselves. HOSTNAME ONLY: full
   referrer URLs carry private context (search terms, for one). Captured
   once per session so an in-site reload can't overwrite the real arrival.
   'direct' = no referrer sent, which is NOT the same as "typed the URL";
   see DEPLOY.md before drawing conclusions from it. */
function refHost() {
  var cached = sessionStorage.getItem('wsag_ref');
  if (cached) return cached;
  var bare = function (h) { return h.toLowerCase().replace(/^www\./, ''); };
  var h = 'direct';
  if (document.referrer) {
    try {
      var d = bare(new URL(document.referrer).hostname);
      h = (d === bare(window.location.hostname)) ? 'self' : d;
    } catch (e) {}
  }
  sessionStorage.setItem('wsag_ref', h);
  return h;
}
function initTracking() {
  try {
    var qs = new URLSearchParams(window.location.search);
    var src = qs.get('utm_source');
    if (src) sessionStorage.setItem('wsag_src', src);
    window.__wsagSrc = src || sessionStorage.getItem('wsag_src') || 'none';
    window.__wsagReturning = localStorage.getItem('wsag_seen') ? '1' : '0';
    localStorage.setItem('wsag_seen', '1');
    window.__wsagRef = refHost();
    track('pageview', 'games');
  } catch (e) {}
}
function track(event, tab) {
  try {
    var params = new URLSearchParams({
      e: event, t: tab || '', s: window.__wsagSrc || 'none',
      r: window.__wsagReturning || '0', site: SITE_ID,
      ref: window.__wsagRef || 'direct'
    });
    var url = TRACK_URL + '?' + params.toString();
    if (navigator.sendBeacon) navigator.sendBeacon(url);
    else fetch(url, { method: 'GET', keepalive: true, mode: 'no-cors' });
  } catch (e) {}
}
window.addEventListener('load', initTracking);
</script>
