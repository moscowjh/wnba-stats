name = "wnba-stats-cron"
main = "worker.js"
compatibility_date = "2025-06-01"

# 11:17 UTC = 7:17am ET (summer/EDT) — dispatches the daily build.
#
# The other three are health-check passes. A fixable problem (failed build,
# stale site, data behind stats.wnba.com) triggers an auto-rebuild and stays
# quiet; the next pass re-checks. The LAST one is final — it stops retrying
# and emails whatever is still broken. Keep this list, and its order, in sync
# with CHECK_CRON / RETRY_CRON / FINAL_CRON in worker.js.
#
#   11:45 UTC — health check, pass 1
#   13:15 UTC — health check, pass 2
#   14:45 UTC — health check, FINAL (emails)
#
# A fifth trigger, 22:00 UTC, dispatched the WWC build (wwc.yml) from
# 2026-08-30 until **2026-09-15**, when the tournament ended and
# wwc.statsataglance.com became an archive whose every rebuild was
# byte-identical. It was removed together with the staleness check that
# watched it — see the header of worker.js for why those two had to go in the
# same change. The WWC site still rebuilds on any push to sites/wwc/** or
# core/**, via the push trigger in .github/workflows/wwc.yml.
#
# ⚠️ Cloudflare's Free plan allows **5 Cron Triggers per ACCOUNT**, not per
# Worker (Paid: 250), and this is the only Worker on the account with any.
# Retiring the WWC dispatch put this list back to **4 of 5**, so there is one
# slot free — the first headroom this account has had since 2026-08-30. A
# sixth trigger anywhere on the account will fail to deploy.
#
# [History — removed 2026-11-10, see the pause note below.]
# 05:07 UTC = 1:07 AM EDT — the PLAYOFF late-night build (added 2026-09-25),
# NIGHT_CRON in worker.js. Dispatches only after a night with playoff games,
# always with post=false. This is the 5th slot: the account is now at **5 of
# 5**. REMOVE it after the Finals, together with NIGHT_CRON and its branch in
# scheduled(), to free the slot.
# ── PAUSED 2026-11-10 for the WNBA offseason — NO cron triggers ─────────
# Jason approved. The 2026 season ended with the Finals (late October); every
# offseason daily build republished the same page. The dispatch and its three
# health checks were paused TOGETHER (a health check with no build to check
# would email "no run today" every morning), and the 05:07 playoff night
# build was removed for good. The account is now at **0 of 5** Free-plan Cron
# Triggers; one is intended for the Ivy League site.
#
# RESTORE BEFORE THE 2027 SEASON (~April 2027) — replace the empty list with:
#
#   crons = ["17 11 * * *", "45 11 * * *", "15 13 * * *", "45 14 * * *"]
#
# then `npx wrangler deploy` from this directory. The code paths in worker.js
# are untouched, so that one line is the whole restore. An explicit empty list
# (not a deleted [triggers] table) is what makes `wrangler deploy` REMOVE the
# schedules already on the deployed Worker.
[triggers]
crons = []

# Keep logs (added 2026-09-29): with this off, a false "No run today" alert
# left no record of what the Worker saw. Free plan retention is short but enough.
[observability]
enabled = true

# Exposes the deployed version id to the code (2026-10-07), so the invocation
# log in scheduled() can show which version each duplicate trigger ran.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Failure alerts via Cloudflare Email Routing on statsataglance.com.
# Requires: Email Routing enabled on the zone, and the destination address
# verified there (it gets a one-time confirmation email).
[[send_email]]
name = "ALERT_EMAIL"
destination_address = "horowitz.jason@gmail.com"
